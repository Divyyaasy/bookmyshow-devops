
name: BookMyShow CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Build Spring Boot application
      - name: Build Spring Boot application
        run: mvn -B clean package -DskipTests

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            sydivyyaa/bookmyshow-backend:latest
            sydivyyaa/bookmyshow-backend:${{ github.sha }}

      # 6. Check GitHub OIDC claims
      - name: Check GitHub OIDC claims
        run: |
          TOKEN_JSON=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          TOKEN=$(echo "$TOKEN_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          python3 -c '
          import sys, json, base64
          p = sys.argv[1].split(".")[1]
          p += "=" * (-len(p) % 4)
          d = json.loads(base64.urlsafe_b64decode(p))
          print("ISS:", d.get("iss"))
          print("AUD:", d.get("aud"))
          print("SUB:", d.get("sub"))
          ' "$TOKEN"

      # 7. Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::858688938415:role/GitHubActions-BookMyShow-Deploy-Role
          aws-region: ap-south-1

      # 8. Deploy application to EC2 using SSM
      - name: Deploy to EC2 using SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0d3492e0a0e799c08" \
            --document-name "AWS-RunShellScript" \
            --comment "BookMyShow automated deployment" \
            --parameters 'commands=["set -e","docker pull sydivyyaa/bookmyshow-backend:latest","docker rm -f bookmyshow-backend || true","docker run -d --name bookmyshow-backend -p 80:8080 --restart unless-stopped sydivyyaa/bookmyshow-backend:latest"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0d3492e0a0e799c08" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-0d3492e0a0e799c08" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out while waiting for SSM."
          exit 1

      - name: Verify application health
        shell: bash
        run: |
          echo "Checking BookMyShow application health..."

          for i in {1..12}; do
            if curl -fsS http://15.206.185.219/api/health; then
              echo ""
              echo "BookMyShow application is healthy!"
              exit 0
            fi

            echo "Application not ready. Retrying in 10 seconds..."
            sleep 10
          done

          echo "Health check failed!"
          exit 1
